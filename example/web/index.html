<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>flutter_native_splash_next example</title>
  <style id="splash-screen-style">
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #EFF7F4;
      overflow: hidden;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #EFF7F4;
      }
    }
    #splash {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 9998;
      pointer-events: none;
    }
    #splash img.splash-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    #splash-logo {
      position: fixed;
      top: 28.0%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: auto;
      z-index: 9999;
      pointer-events: none;
    }
    #splash-branding {
      position: fixed;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      width: 55px;
      height: auto;
      z-index: 9999;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <picture id="splash">
    
    <img class="splash-bg" src="splash/img/light.png" alt="" aria-hidden="true">
  </picture>    <picture>
      
      <img id="splash-logo" src="splash/img/logo.png" alt="" aria-hidden="true">
    </picture>    <picture>
      
      <img id="splash-branding" src="splash/img/branding.png" alt="" aria-hidden="true">
    </picture>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
